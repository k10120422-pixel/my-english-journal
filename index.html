<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My English Journal｜每日英語練習</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./lessons.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<header class="mast"><div class="shell mast-inner"><div class="brand"><span class="mark" aria-hidden="true">Aa</span> My English Journal</div><label class="speed">朗讀速度 <select id="rate"><option value=".5">0.5×</option><option value=".65">0.65×</option><option value=".8" selected>0.8×</option><option value="1">1×</option><option value="1.15">1.15×</option></select></label></div></header>
<main class="shell">
  <div class="date-row"><label for="date">練習日期</label><select id="date"></select></div>
  <section class="hero" aria-labelledby="lesson-title">
    <p id="lesson-date" class="lesson-date"></p><h1 id="lesson-title"></h1><p id="english-title" lang="en"></p><p id="tagline"></p>
    <div id="hero-actions" class="action-row"></div>
  </section>
  <nav class="section-nav" aria-label="教材章節" id="sections"></nav>
  <section id="content" aria-labelledby="section-title"></section>
</main>
<footer class="shell">練習進度保存在目前使用的瀏覽器。</footer>
<p id="audio-status" class="audio-status" role="status" hidden></p>
<noscript>請開啟 JavaScript 以使用英語練習網站。</noscript>
</body>
</html>
